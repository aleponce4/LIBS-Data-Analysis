name: CI

on:
  push:
    branches: [ main, public-rebuild ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # Import every module under src/prolibspector. This is deliberately a
      # separate, early step: a green test suite that never imports the app is
      # how this project once shipped completely broken.
      - name: Import check (Linux headless)
        if: runner.os == 'Linux'
        run: xvfb-run python -m pytest tests/test_imports.py -v

      - name: Import check (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest tests/test_imports.py -v

      - name: Run pytest (Linux headless)
        if: runner.os == 'Linux'
        run: xvfb-run pytest

      - name: Run pytest (Windows)
        if: runner.os == 'Windows'
        run: pytest
