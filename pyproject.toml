[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prolibspector-public"
version = "0.1.0"
description = "Scientific instrument-control and LIBS analysis workbench (Public Edition)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Alejandro Ponce-Flores"}
]
keywords = ["spectroscopy", "LIBS", "scientific-instrumentation", "visualization", "signal-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "matplotlib>=3.5.0",
    "sv-ttk>=2.5.0",
    "pillow>=9.0.0",
    # Hard runtime imports (not optional): the modules below fail to import
    # without these. See label_peaks.py, search_element.py, calibration_curve.py.
    "markdown>=3.4.0",
    "tkhtmlview>=0.1.1",
    "textalloc>=0.0.4",
    "statsmodels>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
# Guarded imports: the app degrades gracefully without these, but the
# wavelet-denoising and Parquet-export features need them.
full = [
    "PyWavelets>=1.3.0",
    "pyarrow>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# There is deliberately no [tool.setuptools.package-data] section, and adding
# one would not help. The bundled assets - Icons/, Help/, element_database.csv,
# persistent_lines.csv and calibration_data_library.csv - live at the repository
# root, beside src/, not inside the prolibspector package. package-data can only
# ship files that live inside a package, and core.paths.source_root() resolves to
# the repository root rather than to the package directory, so the code would not
# read a packaged copy even if one were installed.
#
# Consequence: only an editable install ("pip install -e .") produces a working
# application. A plain "pip install ." installs importable modules whose asset
# root resolves to the interpreter's library directory, where no assets exist.
#
# Making "pip install ." work means moving those five assets inside
# src/prolibspector/ and repointing resource_root() at the package directory
# (keeping working_root()/settings_dir() at a writable location). That is a
# deliberate restructure, not a config tweak, so it is left to the maintainer.

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
