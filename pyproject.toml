[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prolibspector-public"
version = "0.1.0"
description = "Scientific instrument-control and LIBS analysis workbench (Public Edition)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Alejandro Ponce-Flores"}
]
keywords = ["spectroscopy", "LIBS", "scientific-instrumentation", "visualization", "signal-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "matplotlib>=3.5.0",
    "sv-ttk>=2.5.0",
    "pillow>=9.0.0",
    # Hard runtime imports (not optional): the modules below fail to import
    # without these. See label_peaks.py, search_element.py, calibration_curve.py.
    "markdown>=3.4.0",
    "tkhtmlview>=0.1.1",
    "textalloc>=0.0.4",
    "statsmodels>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
# Guarded imports: the app degrades gracefully without these, but the
# wavelet-denoising and Parquet-export features need them.
full = [
    "PyWavelets>=1.3.0",
    "pyarrow>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
